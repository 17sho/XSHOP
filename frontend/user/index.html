<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
  <style>
    :root { color-scheme: light dark; background: #f5f5f7; }
    html, body, #app { min-height: 100%; margin: 0; background: #f5f5f7; }
    html.dark, html.dark body, html.dark #app { background: #000; }
    @media (prefers-color-scheme: dark) {
      :root, html, body, #app { background: #000; }
      html.light, html.light body, html.light #app { background: #f5f5f7; }
    }
  </style>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('dujiao_theme')
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('light', !dark)
      } catch {
        document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches)
      }
    })()
  </script>
  <!-- Website icon links are inserted by the server from current site settings. -->
  <title>XSHOP</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" data-cfasync="false" src="/src/main.ts"></script>
</body>

</html>
